<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121418">
  <meta name="description" content="Track Stronglifts 5x5 workouts">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Stronglifts 5×5</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Today</h1>
    <button id="storage-indicator" class="chip" aria-label="Storage location"></button>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="view" aria-live="polite"></main>

  <div id="timer" class="timer" hidden>
    <div id="timer-progress" class="timer-progress"></div>
    <div class="timer-body">
      <div class="timer-text">
        <span id="timer-time" class="timer-time">1:30</span>
        <span id="timer-label" class="timer-label">Rest</span>
      </div>
      <button class="btn small" data-action="timer-add">+30s</button>
      <button class="btn small ghost" data-action="timer-skip">Skip</button>
    </div>
  </div>

  <nav class="tabs" aria-label="Main">
    <button data-tab="today" class="active"><span aria-hidden="true">🏋️</span>Today</button>
    <button data-tab="history"><span aria-hidden="true">📋</span>History</button>
    <button data-tab="settings"><span aria-hidden="true">⚙️</span>Settings</button>
  </nav>

  <div id="toast" class="toast" role="status"></div>
  <dialog id="modal"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
